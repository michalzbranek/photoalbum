name: CI

on: pull_request

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dev tools
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check
